<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="54" height="54" shape-rendering="crispEdges">
  <!-- 8-bit Gear -->
  <!-- Outer teeth -->
  <rect x="22" y="2" width="10" height="8" fill="#080808" />
  <rect x="22" y="44" width="10" height="8" fill="#080808" />
  <rect x="2" y="22" width="8" height="10" fill="#080808" />
  <rect x="44" y="22" width="8" height="10" fill="#080808" />
  <!-- Diagonal teeth -->
  <rect x="8" y="8" width="8" height="8" fill="#080808" />
  <rect x="38" y="8" width="8" height="8" fill="#080808" />
  <rect x="8" y="38" width="8" height="8" fill="#080808" />
  <rect x="38" y="38" width="8" height="8" fill="#080808" />
  <!-- Gear Ring -->
  <rect x="10" y="10" width="34" height="34" fill="#080808" />
  <!-- Inner Cutout -->
  <rect x="18" y="18" width="18" height="18" fill="var(--bg-primary, #F4F4F2)" />
  <!-- Center axle -->
  <rect x="24" y="24" width="6" height="6" fill="#080808" />
</svg>
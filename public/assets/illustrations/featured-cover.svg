<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg-canvas { fill: var(--bg-secondary, #EBEBE8); }
      .wire { stroke: #080808; stroke-width: 2; fill: none; }
      .wire-broken { stroke: #FF6B35; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
      .wire-active { stroke: #1717F5; stroke-width: 2; fill: none; }
      .node-box { fill: var(--bg-primary, #F4F4F2); stroke: #080808; stroke-width: 2; }
      .node-header { fill: #080808; }
      .node-header-blue { fill: #1717F5; }
      .node-header-orange { fill: #FF6B35; }
      .txt-header { font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 700; fill: #FFFFFF; }
      .txt-body { font-family: 'IBM Plex Mono', monospace; font-size: 8px; fill: var(--text-primary, #080808); }
      .txt-alert { font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 700; fill: #FF6B35; }
      .txt-blue { font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 700; fill: #1717F5; }
    </style>
  </defs>

  <rect width="600" height="360" class="bg-canvas" />

  <!-- Background grid matrix -->
  <g opacity="0.12">
    <path d="M 0 40 H 600 M 0 80 H 600 M 0 120 H 600 M 0 160 H 600 M 0 200 H 600 M 0 240 H 600 M 0 280 H 600 M 0 320 H 600" stroke="#080808" stroke-width="1" fill="none" />
    <path d="M 40 0 V 360 M 80 0 V 360 M 120 0 V 360 M 160 0 V 360 M 200 0 V 360 M 240 0 V 360 M 280 0 V 360 M 320 0 V 360 M 360 0 V 360 M 400 0 V 360 M 440 0 V 360 M 480 0 V 360 M 520 0 V 360 M 560 0 V 360" stroke="#080808" stroke-width="1" fill="none" />
  </g>

  <!-- Network interconnect wires -->
  <path d="M 120 100 H 200 V 70 H 260" class="wire-active" />
  <path d="M 120 120 H 160 V 220 H 240" class="wire" />
  <path d="M 370 70 H 420 V 130 H 460" class="wire-active" />
  <path d="M 350 220 H 440 V 170 H 460" class="wire-broken" />
  <path d="M 280 180 V 130 H 310" class="wire" />
  <path d="M 310 100 H 260" class="wire-broken" />
  <path d="M 460 150 H 550 V 280 H 320" class="wire" />
  <path d="M 120 280 H 220 V 240" class="wire-active" />

  <!-- Node 1: API Gateway (Monolith Remnant) -->
  <g transform="translate(30, 80)">
    <rect width="100" height="70" class="node-box" />
    <rect width="100" height="16" class="node-header" />
    <text x="6" y="11" class="txt-header">POD-001 // GATEWAY</text>
    <text x="6" y="32" class="txt-body">REQ/SEC: 42,109</text>
    <text x="6" y="46" class="txt-body">TLS: TERMINATED</text>
    <text x="6" y="60" class="txt-alert">LATENCY: +840ms</text>
    <!-- Pixel status square -->
    <rect x="86" y="4" width="8" height="8" fill="#FF6B35" />
  </g>

  <!-- Node 2: Auth Service (The Bottleneck) -->
  <g transform="translate(260, 40)">
    <rect width="110" height="70" class="node-box" />
    <rect width="110" height="16" class="node-header-blue" />
    <text x="6" y="11" class="txt-header">AUTH-SVC // v4.2</text>
    <text x="6" y="32" class="txt-body">JWT_VERIFY: OK</text>
    <text x="6" y="46" class="txt-body">CACHE_MISS: 94%</text>
    <text x="6" y="60" class="txt-blue">STATUS: DEGRADED</text>
    <rect x="96" y="4" width="8" height="8" fill="#1717F5" />
  </g>

  <!-- Node 3: Message Broker (Kafka/Redpanda) -->
  <g transform="translate(240, 180)">
    <rect width="120" height="80" class="node-box" />
    <rect width="120" height="16" class="node-header" />
    <text x="6" y="11" class="txt-header">BROKER // CLUSTER-B</text>
    <text x="6" y="32" class="txt-body">TOPIC: order.events</text>
    <text x="6" y="46" class="txt-body">PARTITIONS: 64</text>
    <text x="6" y="60" class="txt-body">LAG: 1,842,910</text>
    <text x="6" y="74" class="txt-alert">CONSUMERS: 1 OF 8</text>
    <rect x="106" y="4" width="8" height="8" fill="#FFD000" />
  </g>

  <!-- Node 4: Billing Service (Silent Failure) -->
  <g transform="translate(460, 110)">
    <rect width="110" height="74" class="node-box" />
    <rect width="110" height="16" class="node-header-orange" />
    <text x="6" y="11" class="txt-header">BILLING-SVC // FAIL</text>
    <text x="6" y="32" class="txt-body">RETRY_COUNT: 5/5</text>
    <text x="6" y="46" class="txt-alert">CIRCUIT: TRIPPED</text>
    <text x="6" y="60" class="txt-body">ERR: TIMEOUT 504</text>
    <rect x="96" y="4" width="8" height="8" fill="#FF0033" />
  </g>

  <!-- Node 5: Postgres Primary -->
  <g transform="translate(40, 240)">
    <rect width="110" height="70" class="node-box" />
    <rect width="110" height="16" class="node-header" />
    <text x="6" y="11" class="txt-header">PG-17 // PRIMARY</text>
    <text x="6" y="32" class="txt-body">CONN_POOL: 99/100</text>
    <text x="6" y="46" class="txt-body">LOCK_WAIT: 4.8s</text>
    <text x="6" y="60" class="txt-blue">MVCC_TUPLES: HOT</text>
    <rect x="96" y="4" width="8" height="8" fill="#00E676" />
  </g>

  <!-- Pixel Art Tiny Mascot on top of Postgres -->
  <g transform="translate(110, 218)">
    <!-- Tiny robot sitting -->
    <rect x="4" y="2" width="12" height="12" fill="#F4F4F0" stroke="#080808" stroke-width="1" />
    <rect x="6" y="5" width="8" height="5" fill="#181818" />
    <rect x="7" y="6" width="2" height="2" fill="#00F0FF" />
    <rect x="11" y="6" width="2" height="2" fill="#00F0FF" />
    <rect x="9" y="10" width="2" height="2" fill="#FF6B35" />
    <!-- Speech bubble -->
    <rect x="18" y="-12" width="56" height="14" fill="#FFFFFF" stroke="#080808" stroke-width="1" />
    <text x="21" y="-3" font-family="'IBM Plex Mono', monospace" font-size="7px" fill="#080808">"Told you so"</text>
  </g>

  <!-- Bottom Legend Banner -->
  <g transform="translate(20, 324)">
    <rect width="560" height="22" fill="#080808" />
    <text x="12" y="14" font-family="'IBM Plex Mono', monospace" font-size="9px" font-weight="700" fill="#FFFFFF">
      [ INCIDENT 2026-X ] DISTRIBUTED CASCADE FAILURE TOPOLOGY // TOTAL MTTR: 4H 18M
    </text>
  </g>
</svg>
